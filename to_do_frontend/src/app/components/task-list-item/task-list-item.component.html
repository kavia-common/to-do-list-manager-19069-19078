<div class="item" [class.completed]="task.completed">
  <label class="checkbox">
    <input type="checkbox" [checked]="task.completed" (change)="onToggleChange($event)" />
  </label>

  <div class="content">
    <div class="title-row">
      <div class="title">{{ task.title }}</div>
      <div class="badges">
        <span *ngIf="task.dueDate" class="badge">Due: {{ task.dueDate | date:'mediumDate' }}</span>
      </div>
    </div>
    <div class="desc" *ngIf="task.description">{{ task.description }}</div>
    <div class="meta">
      <span *ngIf="task.createdAt">Created: {{ task.createdAt | date:'short' }}</span>
      <span *ngIf="task.updatedAt">• Updated: {{ task.updatedAt | date:'short' }}</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn" (click)="onEdit()">Edit</button>
    <button class="btn danger" (click)="onDelete()">Delete</button>
  </div>
</div>
